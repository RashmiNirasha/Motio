# @package _global_

defaults:
    - base

model_name: mstcn

#------------------------------------------------------------
configs:
    # Paths
    root_vid: null
    root_data: "${paths.root_data}" 
    exp_dir: "${paths.exp_dir}"
    storage_folder: ${paths.output_dir}

    # Fixed
    main_task: segmentation
    pipeline: ${model_name}_${configs.input_type}
    eval_name: ${eval_name}
    window_size: null
    sampling_rate: 1
    train_batch_size: 1
    test_batch_size: 1
    train_num_workers: 0
    test_num_workers: 0
    pin_memory: True
    mixed_training: 0
    seed: 3407
    extraction: False
    weights_path: null

    # Data 
    task: 'manipulation' # choices: {manipulation, object, full}
    monitor_task: manipulation # choices: {manipulation, object, full}
    input_type: hand # choices: {body, hand}
    modality: ['Feat']
    exclude_person_not_visible: True
    exclude_person_not_visible_test: True

    # Training
    epochs: 50
    org_batch_size: 1
    gradient_clip_val: null 
    tr_precision: 32
    monitor_metric: f1

    # Feat
    feat_name: hiera
    feat_dim: 768

    # MS-TCN
    num_stages: 4
    num_f_maps: 64
    num_layers: 10
    input_dim: 768
    truncated_mse: True

    # Optim
    solver:
        name: "Adam"
        lr: 0.0005

    # Misc
    wandb_project: CP_Hand

#------------------------------------------------------------
datamodule:
    _target_: src.datamodules.childplay_hand_datamodule.ChildPlayHandDataModule
    cfg: ${configs}
    train: ${train}

#------------------------------------------------------------
model:
    _target_: src.models.mstcn_model.MSTCN_Model
    cfg: ${configs}

#------------------------------------------------------------
trainer:
    _target_: lightning.pytorch.Trainer
    default_root_dir: ${paths.output_dir}
    min_epochs: 1
    max_epochs: ${configs.epochs}
    accelerator: gpu
    devices: 1
    num_nodes: 1
    check_val_every_n_epoch: 1
    deterministic: True
    benchmark: False
    accumulate_grad_batches: 1
    gradient_clip_val: ${configs.gradient_clip_val}
    precision: ${configs.tr_precision}
    num_sanity_val_steps: 0
    limit_train_batches: 1.0
    limit_val_batches: 1.0
    sync_batchnorm: null
    strategy: auto 

#------------------------------------------------------------
callbacks:
    model_checkpoint:
        _target_: lightning.pytorch.callbacks.ModelCheckpoint
        dirpath: ${paths.output_dir}/checkpoints
        filename: "epoch_{epoch:03d}"
        monitor: "val/monitor_metric"
        mode: "max"
        save_last: True
        auto_insert_metric_name: False
        verbose: False
        save_top_k: 1
        save_weights_only: False
        every_n_train_steps: null
        train_time_interval: null
        every_n_epochs: null
        save_on_train_epoch_end: True

    model_summary:
        _target_: lightning.pytorch.callbacks.RichModelSummary
        max_depth: 1

    rich_progress_bar:
        _target_: lightning.pytorch.callbacks.RichProgressBar
        refresh_rate: 1

    learning_rate_monitor:
        _target_: lightning.pytorch.callbacks.LearningRateMonitor

    timer:
        _target_: lightning.pytorch.callbacks.Timer

#------------------------------------------------------------
logger:
    log: True
    wandb:
        _target_: lightning.pytorch.loggers.wandb.WandbLogger
        name: ${task_name}
        save_dir: "${paths.output_dir}"
        offline: False
        id: null
        anonymous: null
        project: ${configs.wandb_project}
        log_model: False
        prefix: ""
        group: ""
        tags: []
        job_type: ""

#------------------------------------------------------------
hydra_logging: colorlog
job_logging: colorlog

suffix_name: ''
eval_name: null
task_name: ${model_name}_${configs.input_type}_${configs.task}${suffix_name}
tags: ["dev"]
train: True
test: True
ckpt_path: null
seed: 3407