<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ChildPlay Live AI</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0 12px;
    background: #101010;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    text-align: center;
}

h1 {
    margin: 16px 0 4px;
}

.subtitle {
    opacity: 0.65;
}

button,
select {
    margin: 16px 6px;
    padding: 14px 24px;
    font-size: 18px;
    border: none;
    border-radius: 14px;
}

#cameraWrap {
    position: relative;
    width: min(94vw, 800px);
    margin: 15px auto;
    background: black;
    border-radius: 18px;
    overflow: hidden;
}

video {
    width: 100%;
    display: block;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}


#hands {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    width: min(94vw, 800px);
    margin: 14px auto;
}

.panel {
    flex: 1 1 300px;
    padding: 16px;
    background: #222;
    border-radius: 16px;
    border-top: 6px solid var(--hand-color);
}

.panel.inactive {
    opacity: 0.45;
}

.handTitle {
    font-weight: 700;
    color: var(--hand-color);
}

.metric {
    margin-top: 14px;
}

.status {
    font-size: 22px;
    font-weight: 800;
    margin: 6px;
}

.good {
    color: #5aef78;
}

.bad {
    color: #ffbe45;
}

.waiting {
    color: #ddd;
}

.probability {
    font-size: 16px;
}

.barOuter {
    width: 100%;
    height: 12px;
    background: #444;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 8px;
}

.barInner {
    height: 100%;
    width: 0%;
    background: white;
    transition: width 0.15s;
}

.details {
    opacity: 0.75;
    font-size: 14px;
    margin-top: 12px;
}

#globalStatus {
    opacity: 0.75;
}

</style>

</head>


<body>


<h1>
ChildPlay Live AI
</h1>

<div class="subtitle">
Child hand-object interaction and pincer grasp monitoring
</div>


<select id="facing">
    <option value="user">Front camera</option>
    <option value="environment">Back camera</option>
</select>

<button id="start">
Start Monitoring
</button>


<div id="globalStatus">
Loading AI...
</div>


<div id="cameraWrap">

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<canvas id="canvas">
</canvas>

</div>


<div id="hands">
</div>


<template id="handPanel">

<div class="panel inactive">

    <div class="handTitle">
    </div>

    <div class="metric">
        <div class="status interactionStatus waiting">—</div>
        <div class="probability interactionProbability">Interaction: —</div>
        <div class="barOuter"><div class="barInner interactionBar"></div></div>
    </div>

    <div class="metric">
        <div class="status pincerStatus waiting">—</div>
        <div class="probability pincerProbability">Pincer: —</div>
        <div class="barOuter"><div class="barInner pincerBar"></div></div>
    </div>

    <div class="details">
        Not visible
    </div>

</div>

</template>


<script type="module">

import {
    SEQUENCE_LENGTH,
    MEDIAPIPE_URL,
    createHandLandmarker,
    makeFeatures,
    toPixelLandmarks,
    HandTracker,
    detectionsFromResult,
    startCamera
} from "./hand-tracking.js";


const {
    HandLandmarker,
    FilesetResolver,
    DrawingUtils
} = await import(MEDIAPIPE_URL);


// --------------------------------------------------
// Elements
// --------------------------------------------------

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const startButton = document.getElementById("start");
const facingSelect = document.getElementById("facing");
const globalStatus = document.getElementById("globalStatus");


// --------------------------------------------------
// State
// --------------------------------------------------

const HAND_COLORS = ["#00ff66", "#3da5ff"];

const PREDICTION_INTERVAL_MS = 250;

let handLandmarker = null;
let drawingUtils = null;
let running = false;
let lastVideoTime = -1;

let threshold = 0.66;
let pincerThreshold = 0.5;
let confirmationRequired = 3;
let confirmationWindow = 4;
let confidenceFill = new Array(21).fill(0.5);

const tracker = new HandTracker(2);


// One independent buffer + decision history per hand.
const hands = tracker.slots.map(slot => {

    const panel =
        document
            .getElementById("handPanel")
            .content
            .firstElementChild
            .cloneNode(true);

    panel.style.setProperty("--hand-color", HAND_COLORS[slot.id]);
    panel.querySelector(".handTitle").textContent = `Hand ${slot.id + 1}`;

    document.getElementById("hands").appendChild(panel);

    return {
        slot,
        panel,
        el: {
            title: panel.querySelector(".handTitle"),
            interactionStatus: panel.querySelector(".interactionStatus"),
            interactionProbability: panel.querySelector(".interactionProbability"),
            interactionBar: panel.querySelector(".interactionBar"),
            pincerStatus: panel.querySelector(".pincerStatus"),
            pincerProbability: panel.querySelector(".pincerProbability"),
            pincerBar: panel.querySelector(".pincerBar"),
            details: panel.querySelector(".details")
        },
        featureBuffer: [],
        landmarkBuffer: [],
        interactionDecisions: [],
        pincerDecisions: [],
        predictionInFlight: false,
        lastPredictionTime: 0,
        handedness: "Unknown",
        // Bumped on reset so late responses for an
        // earlier hand track are ignored.
        generation: 0
    };
});


// --------------------------------------------------
// Fetch model configuration
// --------------------------------------------------

async function loadConfig() {

    const config = await (await fetch("/config")).json();

    threshold = config.threshold;
    pincerThreshold = config.pincer_threshold;
    confirmationRequired = config.confirmation_required;
    confirmationWindow = config.confirmation_window;
    confidenceFill = config.joint_confidence_fill;

    console.log("Model config:", config);

    return config;
}


// --------------------------------------------------
// Per-hand display
// --------------------------------------------------

function resetHand(hand) {

    // Important:
    // don't join two separated
    // hand appearances into one
    // temporal sequence.

    hand.featureBuffer = [];
    hand.landmarkBuffer = [];
    hand.interactionDecisions = [];
    hand.pincerDecisions = [];
    hand.generation += 1;

    const el = hand.el;

    hand.panel.classList.add("inactive");
    el.title.textContent = `Hand ${hand.slot.id + 1}`;

    for (const [status, text, bar, name] of [
        [el.interactionStatus, el.interactionProbability, el.interactionBar, "Interaction"],
        [el.pincerStatus, el.pincerProbability, el.pincerBar, "Pincer"]
    ]) {
        status.textContent = "—";
        status.className = "status waiting";
        text.textContent = `${name}: —`;
        bar.style.width = "0%";
    }

    el.details.textContent = "Not visible";
}


// Require N of the last M positive predictions
// before showing a positive label.
function confirm(decisions, positive) {

    decisions.push(positive);

    if (decisions.length > confirmationWindow) {
        decisions.shift();
    }

    return (
        decisions.length >= confirmationWindow
        &&
        decisions.filter(Boolean).length >= confirmationRequired
    );
}


function showMetric(status, text, bar, name, probability, confirmed, positiveLabel, extra = "") {

    text.textContent =
        `${name}: ${(probability * 100).toFixed(1)}%${extra}`;

    bar.style.width = `${probability * 100}%`;

    status.textContent = confirmed ? positiveLabel : `NO ${positiveLabel}`;
    status.className = "status " + (confirmed ? "good" : "bad");
}


// --------------------------------------------------
// Prediction API
// --------------------------------------------------

async function runPrediction(hand) {

    if (
        hand.predictionInFlight
        ||
        hand.featureBuffer.length < SEQUENCE_LENGTH
    ) {
        return;
    }

    hand.predictionInFlight = true;

    const generation = hand.generation;

    try {

        const response = await fetch("/predict_hand", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                sequence: hand.featureBuffer,
                landmarks: hand.landmarkBuffer
            })
        });

        if (!response.ok) {
            throw new Error("Prediction API error " + response.status);
        }

        const result = await response.json();

        if (generation !== hand.generation) {
            return;
        }

        const el = hand.el;

        showMetric(
            el.interactionStatus,
            el.interactionProbability,
            el.interactionBar,
            "Interaction",
            result.interaction_probability,
            confirm(hand.interactionDecisions, result.interaction),
            "OBJECT INTERACTION"
        );

        showMetric(
            el.pincerStatus,
            el.pincerProbability,
            el.pincerBar,
            "Pincer",
            result.pincer_probability,
            confirm(hand.pincerDecisions, result.pincer),
            "PINCER GRASP",
            result.pincer_source === "heuristic" ? " (rule-based)" : ""
        );

    } catch (error) {

        console.error(error);

        hand.el.interactionStatus.textContent = "Prediction error";

    } finally {

        hand.predictionInFlight = false;
    }
}


// --------------------------------------------------
// Camera
// --------------------------------------------------

startButton.onclick = async () => {

    await startCamera(video, facingSelect.value);

    running = true;

    startButton.style.display = "none";
    facingSelect.style.display = "none";

    globalStatus.textContent = "Looking for hands...";

    requestAnimationFrame(detectLoop);
};


// --------------------------------------------------
// Detection loop
// --------------------------------------------------

function drawHand(landmarks, color) {

    drawingUtils.drawConnectors(
        landmarks,
        HandLandmarker.HAND_CONNECTIONS,
        { color, lineWidth: 4 }
    );

    drawingUtils.drawLandmarks(
        landmarks,
        { color: "#ff3b30", radius: 4 }
    );
}


function detectLoop() {

    if (!running) {
        return;
    }

    if (
        video.readyState >= 2
        &&
        video.currentTime !== lastVideoTime
    ) {

        lastVideoTime = video.currentTime;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const result =
            handLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const { matches, lost } =
            tracker.update(detectionsFromResult(result));

        for (const slot of lost) {
            resetHand(hands[slot.id]);
        }

        const now = performance.now();

        for (const { slot, detection } of matches) {

            const hand = hands[slot.id];

            hand.handedness = detection.handedness;
            hand.panel.classList.remove("inactive");

            drawHand(detection.landmarks, HAND_COLORS[slot.id]);

            const features = makeFeatures(
                detection.landmarks,
                detection.handedness,
                confidenceFill
            );

            if (features.length === 69) {

                hand.featureBuffer.push(features);

                hand.landmarkBuffer.push(
                    toPixelLandmarks(
                        detection.landmarks,
                        video.videoWidth,
                        video.videoHeight
                    )
                );

                if (hand.featureBuffer.length > SEQUENCE_LENGTH) {
                    hand.featureBuffer.shift();
                    hand.landmarkBuffer.shift();
                }
            }

            hand.el.title.textContent =
                `Hand ${slot.id + 1} (${detection.handedness})`;

            hand.el.details.textContent =
                `Buffer: ${hand.featureBuffer.length} / ${SEQUENCE_LENGTH}`;

            // Run prediction roughly
            // four times per second, per hand.

            if (
                hand.featureBuffer.length === SEQUENCE_LENGTH
                &&
                now - hand.lastPredictionTime > PREDICTION_INTERVAL_MS
            ) {
                hand.lastPredictionTime = now;
                runPrediction(hand);
            }
        }

        globalStatus.textContent =
            matches.length === 0
                ? "Looking for hands..."
                : `${matches.length} hand${matches.length > 1 ? "s" : ""} visible`;
    }

    requestAnimationFrame(detectLoop);
}


// --------------------------------------------------
// Start setup
// --------------------------------------------------

hands.forEach(resetHand);

const config = await loadConfig();

globalStatus.textContent = "Loading MediaPipe...";

handLandmarker =
    await createHandLandmarker(HandLandmarker, FilesetResolver);

drawingUtils = new DrawingUtils(ctx);

globalStatus.textContent =
    config.pincer_source === "model"
        ? "Ready"
        : "Ready (pincer: rule-based, no trained pincer model yet)";

</script>


</body>

</html>
